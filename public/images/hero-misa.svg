<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <!-- Latar hero halaman Jadwal Misa: interior gereja saat misa (ilustrasi). -->
  <defs>
    <linearGradient id="dinding" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2417"/>
      <stop offset="0.6" stop-color="#5c3d27"/>
      <stop offset="1" stop-color="#2a170e"/>
    </linearGradient>
    <radialGradient id="cahayaAltar" cx="0.63" cy="0.55" r="0.6">
      <stop offset="0" stop-color="#ffd58a" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#c2703d" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#1c0f08" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sinar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe2a8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffe2a8" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="nyala" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe9b8" stop-opacity="0.9"/>
      <stop offset="0.4" stop-color="#f4b860" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#f4b860" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="kainAltar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7efe2"/>
      <stop offset="1" stop-color="#d9c4a5"/>
    </linearGradient>
    <clipPath id="lengkung">
      <path d="M920 520 V230 a90 90 0 0 1 180 0 V520 Z"/>
    </clipPath>
  </defs>

  <rect width="1600" height="900" fill="url(#dinding)"/>
  <rect width="1600" height="900" fill="url(#cahayaAltar)"/>

  <!-- Pilar samping -->
  <g fill="#120804" opacity="0.85">
    <rect x="700" y="80" width="60" height="640"/>
    <rect x="1260" y="80" width="60" height="640"/>
    <path d="M700 80 Q1010 -40 1320 80 V120 Q1010 0 700 120Z"/>
  </g>

  <!-- Jendela kaca patri melengkung -->
  <path d="M912 528 V230 a98 98 0 0 1 196 0 V528 Z" fill="#120804"/>
  <g clip-path="url(#lengkung)">
    <rect x="920" y="130" width="180" height="400" fill="#7a2222"/>
    <g opacity="0.95">
      <rect x="920" y="130" width="60" height="100" fill="#f4b860"/>
      <rect x="980" y="130" width="60" height="100" fill="#b13a3a"/>
      <rect x="1040" y="130" width="60" height="100" fill="#fcd34d"/>
      <rect x="920" y="230" width="60" height="100" fill="#962d2d"/>
      <rect x="980" y="230" width="60" height="100" fill="#fcd34d"/>
      <rect x="1040" y="230" width="60" height="100" fill="#a8513a"/>
      <rect x="920" y="330" width="60" height="100" fill="#f4b860"/>
      <rect x="980" y="330" width="60" height="100" fill="#efe1cb"/>
      <rect x="1040" y="330" width="60" height="100" fill="#962d2d"/>
      <rect x="920" y="430" width="60" height="100" fill="#b13a3a"/>
      <rect x="980" y="430" width="60" height="100" fill="#f4b860"/>
      <rect x="1040" y="430" width="60" height="100" fill="#7a2222"/>
    </g>
    <!-- Salib di tengah kaca -->
    <rect x="1002" y="200" width="16" height="200" fill="#1c0f08" opacity="0.7"/>
    <rect x="960" y="255" width="100" height="16" fill="#1c0f08" opacity="0.7"/>
    <g stroke="#1c0f08" stroke-width="5" opacity="0.8">
      <line x1="980" y1="130" x2="980" y2="530"/>
      <line x1="1040" y1="130" x2="1040" y2="530"/>
      <line x1="920" y1="230" x2="1100" y2="230"/>
      <line x1="920" y1="330" x2="1100" y2="330"/>
      <line x1="920" y1="430" x2="1100" y2="430"/>
    </g>
  </g>

  <!-- Berkas cahaya dari jendela -->
  <path d="M920 300 L1100 300 L1320 900 L600 900 Z" fill="url(#sinar)" opacity="0.9"/>

  <!-- Altar -->
  <rect x="820" y="610" width="380" height="24" fill="#3a2417"/>
  <path d="M835 634 H1185 V760 H835 Z" fill="url(#kainAltar)"/>
  <rect x="990" y="634" width="40" height="126" fill="#962d2d" opacity="0.85"/>
  <rect x="835" y="740" width="350" height="20" fill="#b08a68" opacity="0.6"/>

  <!-- Salib di atas altar -->
  <rect x="1004" y="520" width="12" height="90" fill="#fcd34d"/>
  <rect x="986" y="540" width="48" height="10" fill="#fcd34d"/>

  <!-- Lilin altar -->
  <g>
    <circle cx="880" cy="560" r="55" fill="url(#nyala)"/>
    <rect x="872" y="575" width="16" height="36" fill="#f7efe2"/>
    <ellipse cx="880" cy="565" rx="6" ry="12" fill="#fcd34d"/>
    <circle cx="1140" cy="560" r="55" fill="url(#nyala)"/>
    <rect x="1132" y="575" width="16" height="36" fill="#f7efe2"/>
    <ellipse cx="1140" cy="565" rx="6" ry="12" fill="#fcd34d"/>
  </g>

  <!-- Lilin besar berdiri di kiri-kanan -->
  <g>
    <circle cx="760" cy="520" r="80" fill="url(#nyala)"/>
    <rect x="748" y="540" width="24" height="160" fill="#efe1cb"/>
    <rect x="736" y="700" width="48" height="12" fill="#5c3d27"/>
    <ellipse cx="760" cy="528" rx="8" ry="16" fill="#fcd34d"/>
    <circle cx="1260" cy="520" r="80" fill="url(#nyala)"/>
    <rect x="1248" y="540" width="24" height="160" fill="#efe1cb"/>
    <rect x="1236" y="700" width="48" height="12" fill="#5c3d27"/>
    <ellipse cx="1260" cy="528" rx="8" ry="16" fill="#fcd34d"/>
  </g>

  <!-- Lantai panti imam -->
  <path d="M600 760 H1420 L1600 820 V900 H0 V820 Z" fill="#1c0f08"/>

  <!-- Bangku umat (siluet, perspektif) -->
  <g fill="#0d0603">
    <path d="M520 800 H1000 V820 H520 Z"/>
    <path d="M1040 800 H1520 V820 H1040 Z"/>
    <path d="M440 840 H990 V866 H440 Z"/>
    <path d="M1050 840 H1600 V866 H1050 Z"/>
    <path d="M340 884 H980 V900 H340 Z"/>
    <path d="M1060 884 H1600 V900 H1060 Z"/>
  </g>
  <!-- Siluet umat -->
  <g fill="#0d0603">
    <circle cx="600" cy="782" r="14"/><path d="M584 800 Q600 784 616 800Z"/>
    <circle cx="690" cy="780" r="15"/><path d="M672 800 Q690 782 708 800Z"/>
    <circle cx="1130" cy="782" r="14"/><path d="M1114 800 Q1130 784 1146 800Z"/>
    <circle cx="1240" cy="780" r="15"/><path d="M1222 800 Q1240 782 1258 800Z"/>
    <circle cx="540" cy="818" r="17"/><path d="M520 840 Q540 820 560 840Z"/>
    <circle cx="820" cy="818" r="17"/><path d="M800 840 Q820 820 840 840Z"/>
    <circle cx="1180" cy="818" r="17"/><path d="M1160 840 Q1180 820 1200 840Z"/>
    <circle cx="1400" cy="818" r="17"/><path d="M1380 840 Q1400 820 1420 840Z"/>
  </g>

  <!-- Debu cahaya -->
  <g fill="#ffe2a8" opacity="0.5">
    <circle cx="980" cy="420" r="2"/><circle cx="1050" cy="480" r="1.5"/><circle cx="930" cy="560" r="1.8"/>
    <circle cx="1100" cy="610" r="1.4"/><circle cx="1010" cy="680" r="1.6"/><circle cx="880" cy="700" r="1.2"/>
  </g>
</svg>
